[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-foliant"
version = "0.1.0"
description = "Foliant for LangChain: a payment tool for agents paying over x402 and a middleware that enforces a crew's spending budget on every tool call"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "Machine Quotient Ltd", email = "gaz@garethoyston.com"}]
dependencies = ["langchain-core>=1.0", "langchain>=1.0", "foliant-protocol>=0.1.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests>=1.0", "fastapi>=0.110"]

[project.urls]
Homepage = "https://foliant.network"
Source = "https://github.com/gazoy/langchain-foliant"

[tool.setuptools]
packages = ["langchain_foliant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore:.*httpx2.*"]
